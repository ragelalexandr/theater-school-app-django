{% extends "core/base.html" %}

{% block title %}Смена пароля{% endblock %}

{% block content %}
    <div class="container">
        <h2 class="text-center">Смена пароля</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить новый пароль</button>
        </form>
    </div>
{% endblock %}
